services:
  charon:
    build: .
    environment:
      - CHARON_MODE=direct
      - CHARON_HTTP=:18484
      - CHARON_ADMIN_HTTP=/tmp/charon-admin.sock
      - CHARON_UPSTREAM=${CHARON_UPSTREAM:-http://host.docker.internal:18483}
      - CHARON_PUBLIC_URL=${CHARON_PUBLIC_URL:-http://localhost:18484}
      - LETHE_API_KEY=${LETHE_API_KEY}
      - CHARON_HMAC_KEY=${CHARON_HMAC_KEY:-}
      - CHARON_DATA_DIR=/data
      - CHARON_AUTH_MODE=${CHARON_AUTH_MODE:-obol}
      - CHARON_OAUTH_CLIENT_ID=${CHARON_OAUTH_CLIENT_ID:-chatgpt-mcp}
      - CHARON_OAUTH_DEFAULT_USER=${CHARON_OAUTH_DEFAULT_USER:-}
      - CHARON_OAUTH_REDIRECT_URIS=${CHARON_OAUTH_REDIRECT_URIS:-}
      # Auto-bootstrap (optional)
      - CHARON_AUTO_USER=${CHARON_AUTO_USER:-}
      - CHARON_AUTO_PERMISSION=${CHARON_AUTO_PERMISSION:-readonly}
      - CHARON_AUTO_PROJECT=${CHARON_AUTO_PROJECT:-default}
      - CHARON_AUTO_PROJECTS=${CHARON_AUTO_PROJECTS:-}
      - CHARON_AUTO_EXPIRES=${CHARON_AUTO_EXPIRES:-7d}
    volumes:
      - ./charon-data:/data
      - ./secrets:/secrets:ro
      - ./workspace:/workspace:rw
      - ./code:/code:ro
    networks:
      - edge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18484:18484"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18484/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge: {}
