name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Unformatted Go files:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...

      - name: Race tests
        run: go test -race ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Security static analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.5 -quiet ./...

      - name: Validate shell scripts
        run: |
          while IFS= read -r -d '' script; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: Assert scripts stay executable
        run: |
          # Scripts shipped for direct execution must keep their exec bit.
          test -x scripts/bootstrap-memory-git-e2e.sh
          while IFS= read -r -d '' script; do
            [ -x "$script" ] || { echo "not executable: $script"; exit 1; }
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Validate Compose files
        env:
          CHARON_PUBLIC_URL: https://charon.example.test
          CHARON_OAUTH_DEFAULT_USER: principal_ci_placeholder
          LETHE_API_KEY: ci-placeholder
          CHARON_OBOL_HMAC_KEY: ci-placeholder
          CHARON_MERGE_HMAC_KEY: ci-placeholder
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.memory-git-test.yml config --quiet

      - name: Build hardened container
        run: docker build -t charon-ci:${{ github.sha }} .

      - name: Verify non-root image
        run: |
          test "$(docker image inspect charon-ci:${{ github.sha }} --format '{{.Config.User}}')" = '10001:10001'
          docker run --rm --entrypoint /usr/bin/id charon-ci:${{ github.sha }} | grep -q 'uid=10001(charon)'
